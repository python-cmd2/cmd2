# For documentation on GitHub Actions Workflows, see:
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
name: TypeCheck
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Needed for setuptools_scm to work correctly

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check typing using ty
        run: uv run --no-default-groups --group validate ty check

      - name: Check typing using mypy
        run: uv run --no-default-groups --group validate mypy .

  # Single stable status check for the whole type-check matrix, so branch
  # protection doesn't need updating every time the Python matrix changes.
  all-type-checks-passed:
    name: All Type Checks Passed
    if: always()
    needs: [type-check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any matrix job did not succeed
        if: needs['type-check'].result != 'success'
        run: exit 1
