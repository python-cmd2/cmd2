[build-system]
requires = ["build>=1.3.0", "setuptools>=80.8.0", "setuptools-scm>=9.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cmd2"
dynamic = ["version"]
description = "cmd2 - quickly build feature-rich and user-friendly interactive command line applications in Python"
authors = [{ name = "cmd2 Contributors" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["CLI", "cmd", "command", "interactive", "prompt", "Python"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "prompt-toolkit>=3.0.53",
    "pyperclip>=1.8.2",
    "rich>=15.0.0",
    "rich-argparse>=1.7.2",
]

[dependency-groups]
build = ["build>=1.3.0", "setuptools>=80.8.0", "setuptools-scm>=9.2.1"]
dev = [
    "codecov>=2.1",
    "ipython>=8.23",
    "mkdocstrings[python]>=1",
    "prek>=0.3.5",
    "pytest>=8.1.1",
    "pytest-cov>=5",
    "pytest-mock>=3.14.1",
    "ruff>=0.14.10",
    "ty>=0.0.73",
    "uv-publish>=1.3",
    "zensical>=0.0.17",
]
docs = [
    "mkdocstrings[python]>=1",
    "setuptools>=80.8.0",
    "setuptools_scm>=8",
    "zensical>=0.0.44",
]
quality = ["prek>=0.3.5"]
test = [
    "codecov>=2.1",
    "coverage>=7.11",
    "pytest>=8.1.1",
    "pytest-cov>=5",
    "pytest-mock>=3.14.1",
]
validate = ["ruff>=0.14.10", "ty>=0.0.73", "types-setuptools>=80.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=cmd2",
    "--cov-append",
    "--cov-report=term",
    "--cov-report=html",
]

[tool.setuptools]
packages = ["cmd2"]

[tool.setuptools_scm]

[tool.uv]
default-groups = ["build", "dev"]
